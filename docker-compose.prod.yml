# Production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
# Chỉ Caddy mở port ra internet; db/backend/frontend chỉ nói chuyện trong mạng Docker.
services:
  db:
    ports: !reset []

  backend:
    ports: !reset []

  frontend:
    ports: !reset []

  caddy:
    image: caddy:2.10-alpine
    container_name: ndc_caddy
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in the root .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  # Tên riêng để profile prod không bao giờ chạy nhầm lên volume dev (dev đã ghi nhận seed V18/V20).
  postgres_data:
    name: ndc_prod_postgres_data
  caddy_data:
    name: ndc_caddy_data
  caddy_config:
    name: ndc_caddy_config
